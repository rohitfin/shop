<div class="container">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <h3>Login</h3>

      <form [formGroup]="myForm" (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="email">Email address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            aria-describedby="emailHelp"
            formControlName="email"
            [ngClass]="{'is-invalid': isSubmitted && myFormControl['email'].invalid}"
          />
          <small id="emailHelp" class="form-text text-muted"
            >We'll never share your email with anyone else.</small
          >
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            type="password"
            class="form-control"
            id="password"
            formControlName="password"
            [ngClass]="{'is-invalid': isSubmitted && myFormControl['password'].invalid}"
          />
        </div>
        <button type="submit" class="btn btn-primary mt-2" [disabled]="isSubmitting">
          {{isSubmitting ? "Submitting..." : "Submit"}}
        </button>
        <p class="mt-2">
          <small>User Name: {{credential.email}}</small>
          <small>Password: {{credential.password}}</small>
        </p>
      </form>
    </div>
  </div>
</div>
