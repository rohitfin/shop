<div class="container">
    <div class="row">
        <div class="col-12">
            <h3 [appHighlight]="'lightblue'">custom works!</h3>
        </div>
        <div class="col-6 col-sm-4">
            <p >Input : {{inputText | capitalize: 12}}</p>
            <input type="text" [(ngModel)]="inputText">
        </div>
        <div class="col-6 col-sm-4">
            <div class="d-flex flex-row gap-2 mb-2">
                <span> Amount : {{withoutGST}}, </span>
                <span>GST Amount : {{withoutGST | gstCalculator}}</span>
            </div>
            <input type="number" [(ngModel)]="withoutGST" >
        </div>
    </div>
</div>
